"<!DOCTYPE html>"
"<html lang="en">"
"<head>"
"  <meta charset="UTF-8">"
"  <meta name="viewport" content="width=device-width, initial-scale=1.0">"
"  <title>ShadowPlay</title>"
"  <style>"
"    * { box-sizing: border-box; }"
"    body { margin: 0; background: #101116; color: white; font-family: Arial, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; }"
"    main { width: 100%; max-width: 650px; text-align: center; }"
"    h1 { font-size: 42px; margin-bottom: 8px; }"
"    p { color: #a8abb8; }"
"    form { display: flex; gap: 8px; margin-top: 28px; }"
"    input { flex: 1; min-width: 0; padding: 15px; border-radius: 12px; border: 1px solid #343746; background: #1b1d27; color: white; font-size: 16px; }"
"    button { padding: 15px 18px; border: 0; border-radius: 12px; background: #8b5cf6; color: white; font-weight: bold; }"
"    footer { margin-top: 35px; font-size: 13px; color: #777b8c; }"
"  </style>"
"</head>"
"<body>"
"  <main>"
"    <h1>🌙 ShadowPlay</h1>"
"    <p>Your web, your way.</p>"
"    <form id="search">"
"      <input id="query" placeholder="Search the web or enter a URL" aria-label="Search or website address" required>"
"      <button type="submit">Go</button>"
"    </form>"
"    <footer>ShadowPlay · A new way to explore the web</footer>"
"  </main>"
"  <script>"
"    document.getElementById('search').addEventListener('submit', function(e) {"
"      e.preventDefault();"
"      const q = document.getElementById('query').value.trim();"
"      if (!q) return;"
"      const looksLikeUrl = /^[a-zA-Z0-9-]+(\\.[a-zA-Z0-9-]+)+(\\/.*)?$/.test(q) || /^https?:\\/\\//i.test(q);"
"      const destination = looksLikeUrl ? ( /^https?:\\/\\//i.test(q) ? q : 'https://' + q ) : 'https://duckduckgo.com/?q=' + encodeURIComponent(q);"
"      window.location.href = destination;"
"    });"
"  </script>"
"</body>"
"</html>"
